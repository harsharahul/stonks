services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: stonks
      POSTGRES_USER: stonks
      POSTGRES_PASSWORD: stonks_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stonks -d stonks"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  stonks-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      # Override localhost values from .env with Docker service names
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      OLLAMA_HOST: http://ollama:11434
      # OIDC comes from .env via env_file above
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  stonks-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_OIDC_AUTHORITY: "https://auth.example.com/application/o/stonks/"
        VITE_OIDC_CLIENT_ID: "R2TuyGZE9ST1bfSDz2qWQfhdS4MofWLV3TEUhMuS"
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - stonks-api

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    profiles: ["llm"]

volumes:
  pgdata:
