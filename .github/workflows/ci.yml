name: CI

# Pull requests run the backend test matrix, the frontend build, both audits,
# and a single-architecture image build. Pushes to main and published releases
# additionally publish the multi-architecture images to ghcr.io.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt pip-audit
      - name: Version file matches the frontend package
        run: |
          v="$(cat VERSION)"
          f="$(node -p "require('./frontend/package.json').version")"
          echo "VERSION=$v frontend=$f"
          test "$v" = "$f"
      - name: Import the API and the worker
        env:
          ENVIRONMENT: development
        run: |
          python -c "from app.main import app; print('api', app.version)"
          python -c "from app.worker import worker; print('worker ok')"
      - name: Unit tests
        run: pytest -q
      - name: Audit Python dependencies for known vulnerabilities
        # The ignored advisories are fixed only on the langchain / langgraph 1.x
        # line (the desk engine migration in ROADMAP.md) or have no fix (ecdsa
        # timing side channel, transitive via python-jose). Anything new fails.
        run: |
          pip-audit --progress-spinner off --strict \
            --ignore-vuln PYSEC-2026-1325 \
            --ignore-vuln PYSEC-2026-2192 --ignore-vuln PYSEC-2026-2193 --ignore-vuln PYSEC-2026-2562 \
            --ignore-vuln PYSEC-2026-76 --ignore-vuln PYSEC-2026-77 \
            --ignore-vuln PYSEC-2026-83 --ignore-vuln PYSEC-2026-2194 \
            --ignore-vuln PYSEC-2026-1527 --ignore-vuln PYSEC-2026-2573 --ignore-vuln PYSEC-2026-2574

  frontend:
    name: Frontend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit production dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Docker image (${{ matrix.image }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: stonks-backend
            dockerfile: Dockerfile.backend
          - image: stonks-frontend
            dockerfile: Dockerfile.frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      - name: Build (and push on main and releases)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
