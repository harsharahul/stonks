events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # WebSocket connection upgrade map
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen       80;
        listen  [::]:80;
        server_name  localhost;

        # H1: Security headers
        server_tokens off;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Serve static files. Hashed assets (index-<hash>.js/css) cache forever;
        # index.html must NEVER cache or browsers keep serving the previous
        # release's bundle after a deploy (observed 2026-06-11).
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }

        location /assets/ {
            root   /usr/share/nginx/html;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # API proxy — uses variable so nginx starts even if upstream is unresolvable.
        # In docker-compose the upstream is stonks-api; in k3s, Traefik routes /api
        # directly to the backend service so these blocks are never hit.
        resolver 127.0.0.11 valid=30s;
        set $backend "stonks-api:8080";

        location /api/ {
            proxy_pass http://$backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
        }

        # Health & ready — answered by nginx itself. These used to proxy via
        # the Docker-embedded resolver (127.0.0.11), which doesn't exist in
        # k3s, so public-root /health hung for 20s+. Frontend liveness is
        # what these mean now; backend health lives at /api/v1/health.
        location = /health {
            default_type application/json;
            return 200 '{"status":"healthy","service":"stonks-frontend"}';
        }

        location = /ready {
            default_type application/json;
            return 200 '{"status":"ready","service":"stonks-frontend"}';
        }
    }
}
