<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/brand/stonks-icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/brand/stonks-icon-512.png" />
    <meta name="description" content="Self-hostable market terminal: open signals with public track records, an AI analyst desk, and paper trading through your own broker." />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stonks</title>
    <script>
      (function(){
        var t = localStorage.getItem('stonks-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
